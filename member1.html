<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>E-Learning | Online Platform</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
</head>

<body class="bg-light">

  <!-- Header -->
  <header class="bg-dark">

    <div class="container d-flex justify-content-between align-items-center py-3">

      <!-- Logo -->
      <div class="text-white fw-bold fs-3">
        E-Learning
      </div>

      <!-- Navigation -->
      <nav class="d-flex gap-4">

        <a href="#" class="text-white text-decoration-none">
          Home
        </a>

        <a href="#" class="text-white text-decoration-none">
          Courses
        </a>

        <a href="#" class="text-white text-decoration-none">
          Categories
        </a>

        <a href="#" class="text-white text-decoration-none">
          About
        </a>

        <a href="#" class="text-white text-decoration-none">
          Contact
        </a>

      </nav>

      <!-- Search + Sign Up -->
      <div class="d-flex gap-2">

        <input
          type="text"
          class="form-control rounded-pill"
          placeholder="Search"
        >

        <button class="btn btn-warning rounded-pill px-4 fw-bold">
          Sign Up
        </button>

      </div>

    </div>

  </header>


  <!-- Main -->
  <main class="container bg-white py-5 mt-5">

    <!-- Title -->
    <h1 class="text-center fw-bold text-dark fs-2 mb-5">
      POPULAR COURSES
    </h1>


    <!-- Courses -->
    <section class="row g-4">

      <!-- JavaScript -->
      <article class="col-12 col-md-6 col-lg-3">

        <div class="card h-100 shadow-sm border-0 rounded-4 p-4 text-center">

          <div class="fs-1 mb-4">
            JS
          </div>

          <h5 class="fw-bold mb-4">
            JavaScript
          </h5>

          <a
            href="#"
            class="btn btn-outline-primary rounded-pill mt-auto"
          >
            Start
          </a>

        </div>

      </article>


      <!-- Python -->
      <article class="col-12 col-md-6 col-lg-3">

        <div class="card h-100 shadow-sm border-0 rounded-4 p-4 text-center">

          <div class="fs-1 mb-4">
            🐍
          </div>

          <h5 class="fw-bold mb-4">
            Python
          </h5>

          <a
            href="#"
            class="btn btn-outline-primary rounded-pill mt-auto"
          >
            Start
          </a>

        </div>

      </article>


      <!-- UI/UX -->
      <article class="col-12 col-md-6 col-lg-3">

        <div class="card h-100 shadow-sm border-0 rounded-4 p-4 text-center">

          <div class="fs-1 mb-4">
            🎨
          </div>

          <h5 class="fw-bold mb-4">
            UI/UX Design
          </h5>

          <a
            href="#"
            class="btn btn-outline-primary rounded-pill mt-auto"
          >
            Start
          </a>

        </div>

      </article>


      <!-- Database -->
      <article class="col-12 col-md-6 col-lg-3">

        <div class="card h-100 shadow-sm border-0 rounded-4 p-4 text-center">

          <div class="fs-1 mb-4">
            🗄️
          </div>

          <h5 class="fw-bold mb-4">
            Database
          </h5>

          <a
            href="#"
            class="btn btn-outline-primary rounded-pill mt-auto"
          >
            Start
          </a>

        </div>

      </article>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>

</body>

</html>
